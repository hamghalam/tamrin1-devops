name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build Docker image
        run: docker build -t tamrin1-api:ci .

      - name: Smoke test Docker container
        run: |
          docker run -d --name tamrin1-api -p 8000:8000 tamrin1-api:ci

          for i in {1..10}; do
            if curl --silent --fail http://127.0.0.1:8000/; then
              docker stop tamrin1-api
              exit 0
            fi
            sleep 1
          done

          docker logs tamrin1-api
          docker stop tamrin1-api
          exit 1
